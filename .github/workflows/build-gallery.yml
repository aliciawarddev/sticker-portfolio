name: Build gallery

on:
  push:
    paths:
      - 'images/**'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Rebuild gallery-data.js
        run: node build-gallery.js

      - name: Save the result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gallery-data.js
          git diff --staged --quiet || (git commit -m "Update gallery" && git push)