<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Drawings</title>
  <meta name="description" content="A small portfolio of sticker drawings.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Sticker Drawings</h1>
    <p class="tagline">What I've been drawing lately</p>
  </header>

  <main>
    <!-- The gallery fills itself from the images folder. No editing needed. -->
    <section class="gallery" id="gallery" aria-label="Sticker drawings"></section>
    <p class="empty-message" id="empty-message" hidden>No drawings yet. Check back soon.</p>
    <noscript><p class="empty-message">Please turn on JavaScript to see the gallery.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>Made by Your Name</p>
  </footer>

  <!-- Viewer -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged drawing" hidden>
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous drawing">&#8249;</button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next drawing">&#8250;</button>
    <figure class="lb-content">
      <img id="lb-img" src="" alt="">
      <figcaption>
        <span id="lb-title"></span>
        <span id="lb-date"></span>
      </figcaption>
    </figure>
  </div>

  <!-- gallery-data.js is rebuilt automatically by GitHub when images change -->
  <script src="gallery-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
